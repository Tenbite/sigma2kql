# sigma2kql configuration
# Changing anything here (or in a custom pipeline file) triggers a full rebuild on the next run.

# Which KQL flavor to generate:
#   microsoft_xdr  - Defender XDR / MDE Advanced Hunting tables (DeviceProcessEvents, ...).
#                    Also works in Sentinel when the Defender XDR connector streams those tables.
#   sentinel_asim  - Sentinel ASIM parsers (imProcessCreate, imNetworkSession, ...)
#   azure_monitor  - Log Analytics / Azure Monitor tables (SecurityEvent, ...)
target: microsoft_xdr

# Where the workflow clones SigmaHQ/sigma, and which of its rule folders to convert.
sigma_dir: sigma
rule_dirs:
  - rules
  - rules-emerging-threats
  - rules-threat-hunting

# Only convert rules with these values. Remove a key to accept everything.
statuses: [stable, test]
levels: [medium, high, critical]

# Your own pySigma processing pipelines (field mappings for rules that fail to convert).
# They run before the backend's pipeline. See pipelines/custom.yml.
custom_pipelines:
  - pipelines/custom.yml

# Output
output_dir: kql
reports_dir: reports
state_file: state/state.json

# Validate every query with Microsoft's Kusto parser before writing it.
# Queries that fail validation are not written to output_dir; they go to reports/validation_failed.md.
validate: true

# Validate against the current Defender XDR schema instead of the one bundled with
# pySigma-backend-kusto (last updated Sept 2024). Only used with target: microsoft_xdr.
# Each successful download is saved to `cache` and committed, so schema changes show up in
# git history and trigger a full rebuild. If the download fails, the cached copy is used.
# Tables missing from the download fall back to the bundled schema.
# Remove this block to validate with the bundled schema only.
live_schema:
  url: https://xdrinternals.com/FullSchema-latest.json
  cache: state/xdr_schema.json
  required_tables: [DeviceProcessEvents, DeviceRegistryEvents, DeviceFileEvents]

# Rewrite comparisons where the backend left a Sigma * wildcard inside a string
# (e.g. endswith "...\Tree*"), which KQL would treat as a literal asterisk and never match.
# Rewritten rules are listed in reports/wildcard_rewrites.md.
rewrite_wildcards: true
