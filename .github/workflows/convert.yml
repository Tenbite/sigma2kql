name: Convert Sigma to KQL

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild every rule instead of only changed ones"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - config.yml
      - pipelines/**
      - scripts/**
      - validator/**
      - requirements.txt
      - package.json

permissions:
  contents: write

concurrency:
  group: sigma2kql
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install tools
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Clone SigmaHQ (full history, no file contents until needed)
        run: git clone --filter=blob:none --quiet https://github.com/SigmaHQ/sigma.git sigma

      - name: Convert and validate
        run: python scripts/convert.py ${{ inputs.full && '--full' || '' }}

      - name: Build search page
        run: python scripts/build_site.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A kql reports state docs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          sha=$(git -C sigma rev-parse --short HEAD)
          git commit -m "Update KQL from SigmaHQ ${sha}"
          git push

      # Fails the run (so GitHub emails you) when the health check in convert.py found a
      # problem. Runs after the commit so the reports explaining it are already in the repo.
      - name: Health check
        run: |
          if [ -s health_problems.txt ]; then
            echo "::error title=sigma2kql health check failed::$(tr '\n' ' ' < health_problems.txt)"
            cat health_problems.txt
            exit 1
          fi
          echo "Healthy."

      # Optional dead man's switch: pings a monitor such as healthchecks.io after every healthy
      # run. If the pings stop (workflow disabled, GitHub outage, repeated failures), the
      # monitor emails you. Set the ping URL as the HEALTHCHECK_URL repository secret.
      - name: Heartbeat
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" > /dev/null && echo "Heartbeat sent."
          else
            echo "No HEALTHCHECK_URL secret set; skipping heartbeat."
          fi
