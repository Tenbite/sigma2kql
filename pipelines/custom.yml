# Your own pySigma processing pipeline.
#
# Runs before the backend's pipeline (priority 5 < 10), so you can rename a Sigma field
# to the real column name before the backend rejects it as unmapped.
#
# Workflow: open reports/failed.md, pick a common "Unmapped field" reason, check the target
# table's columns in the Microsoft docs, add a mapping here, push. Any change to this file
# triggers a full rebuild on the next run.
#
# Keep mappings scoped with rule_conditions so a rename only applies to the log source it is
# correct for. Validation proves a query parses and uses real columns and types; it does not
# prove the logic still matches the original rule, so read the converted query once.
#
# Transformation reference: https://sigmahq-pysigma.readthedocs.io/en/latest/Processing_Pipelines.html

name: sigma2kql custom mappings
priority: 5
transformations:
  # Sysmon's SourceFilename (old path in a rename) -> MDE DeviceFileEvents.PreviousFileName
  - id: file_rename_sourcefilename
    type: field_name_mapping
    mapping:
      SourceFilename: PreviousFileName
    rule_conditions:
      - type: logsource
        product: windows
        category: file_rename

  # file_delete rules map to DeviceFileEvents, which also holds creates and modifications.
  # Without this they match any file event at the path, not just deletions.
  - id: file_delete_actiontype
    type: add_condition
    conditions:
      ActionType: FileDeleted
    rule_conditions:
      - type: logsource
        category: file_delete

  # Same problem for registry deletions in DeviceRegistryEvents.
  - id: registry_delete_actiontype
    type: add_condition
    conditions:
      ActionType: [RegistryKeyDeleted, RegistryValueDeleted]
    rule_conditions:
      - type: logsource
        category: registry_delete

  # MDE doesn't record file reads, so file_access rules would match file writes instead.
  # Fail them on purpose so they show up in reports/failed.md with this reason.
  - id: file_access_unsupported
    type: rule_failure
    message: "MDE does not record file reads; file_access rules would match writes instead"
    rule_conditions:
      - type: logsource
        category: file_access

  # GrandParentImage maps to InitiatingProcessParentFileName, which holds only a file name
  # (rundll32.exe), so `endswith "\rundll32.exe"` never matches. Strip the path part.
  - id: grandparent_strip_path
    type: replace_string
    regex: '^.*\\'
    replacement: ''
    field_name_conditions:
      - type: include_fields
        fields: [GrandParentImage]

  # Template - copy, uncomment and edit:
  # - id: my_mapping
  #   type: field_name_mapping
  #   mapping:
  #     SigmaFieldName: TableColumnName
  #   rule_conditions:
  #     - type: logsource
  #       product: windows
  #       category: process_creation
